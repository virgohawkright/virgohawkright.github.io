<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trivia Game</title>
  <style>
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      text-align: center;
      padding: 20px;
    }
    .hidden { display: none; }
    .cog-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 50px;
    }
    .cog {
      font-size: 50px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cog:hover { transform: scale(1.2); }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #555; }
    .question-box {
      margin-top: 40px;
    }
    .hint { color: gold; margin: 5px 0; }
    input[type=text] {
      padding: 8px;
      width: 300px;
      border: 1px solid #777;
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Select a Category</h1>
    <div class="cog-row">
      <div class="cog" data-cat="jack">⚙️</div>
      <div class="cog" data-cat="history">⚙️</div>
      <div class="cog" data-cat="science">⚙️</div>
      <div class="cog" data-cat="movies">⚙️</div>
      <div class="cog" data-cat="sports">⚙️</div>
    </div>
    <h2 id="category-title"></h2>
    <button id="continue-btn" class="btn hidden">Continue</button>
  </div>

  <div id="game" class="hidden">
    <button id="back-btn" class="btn">Back</button>
    <div class="question-box">
      <p id="question"></p>
      <div id="hints"></div>
      <input type="text" id="answer" placeholder="Answer" />
      <button id="submit-btn" class="btn">Submit</button>
    </div>
  </div>

  <script>
    const categories = {
      jack: {
        name: "You Don't Know Jack",
        levels: [
          { q: "With the right spec, speaking with them is a meeting of the... mind.", 
            answers: ["think tank", "tank"],
            hints: ["Think Tank", "You're a tank, and he's in a tank."] }
        ],
        progress: 0
      },
      history: { name: "History Buff", levels: [{q:"Who was the first US president?", answers:["george washington"], hints:["First president","On the dollar bill"]}], progress:0 },
      science: { name: "Science Facts", levels: [{q:"What planet is known as the Red Planet?", answers:["mars"], hints:["Fourth planet","Named after Roman god of war"]}], progress:0 },
      movies: { name: "Movie Madness", levels: [{q:"Who directed Jaws?", answers:["steven spielberg"], hints:["Famous director","Also made E.T."]}], progress:0 },
      sports: { name: "Sports Trivia", levels: [{q:"How many players on a soccer team?", answers:["11"], hints:["Odd number","Ten plus one"]}], progress:0 }
    };

    let currentCategory = null;
    let wrongAttempts = 0;

    const menu = document.getElementById("menu");
    const game = document.getElementById("game");
    const title = document.getElementById("category-title");
    const continueBtn = document.getElementById("continue-btn");
    const backBtn = document.getElementById("back-btn");
    const questionEl = document.getElementById("question");
    const hintsEl = document.getElementById("hints");
    const answerEl = document.getElementById("answer");

    document.querySelectorAll(".cog").forEach(cog => {
      cog.addEventListener("click", () => {
        const cat = cog.dataset.cat;
        currentCategory = categories[cat];
        title.textContent = currentCategory.name;
        continueBtn.classList.remove("hidden");
      });
    });

    continueBtn.addEventListener("click", () => {
      menu.classList.add("hidden");
      game.classList.remove("hidden");
      loadLevel();
    });

    backBtn.addEventListener("click", () => {
      game.classList.add("hidden");
      menu.classList.remove("hidden");
      title.textContent = "";
      continueBtn.classList.add("hidden");
    });

    document.getElementById("submit-btn").addEventListener("click", () => {
      const level = currentCategory.levels[currentCategory.progress];
      const input = answerEl.value.toLowerCase().trim();
      if (level.answers.includes(input)) {
        currentCategory.progress++;
        wrongAttempts = 0;
        if (currentCategory.progress >= level.length) {
          questionEl.textContent = "You Win!";
          hintsEl.innerHTML = "";
        } else {
          loadLevel();
        }
      } else {
        wrongAttempts++;
        showHints();
      }
      answerEl.value = "";
    });

    function loadLevel() {
      const level = currentCategory.levels[currentCategory.progress];
      questionEl.textContent = level.q;
      hintsEl.innerHTML = "";
      wrongAttempts = 0;
    }

    function showHints() {
      const level = currentCategory.levels[currentCategory.progress];
      hintsEl.innerHTML = "";
      for (let i = 0; i < wrongAttempts && i < level.hints.length; i++) {
        const hint = document.createElement("div");
        hint.className = "hint";
        hint.textContent = "HINT: " + level.hints[i];
        hintsEl.appendChild(hint);
      }
    }
  </script>
</body>
</html>
