<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trivia Game</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu">
    <h1>Select a Category</h1>
    <div class="cog-row">
      <div class="cog" data-cat="jack">⚙️</div>
      <div class="cog" data-cat="history">⚙️</div>
      <div class="cog" data-cat="science">⚙️</div>
      <div class="cog" data-cat="movies">⚙️</div>
      <div class="cog" data-cat="sports">⚙️</div>
    </div>
    <h2 id="category-title"></h2>
    <button id="continue-btn" class="btn hidden">Continue</button>
  </div>

  <div id="game" class="hidden">
    <button id="back-btn" class="btn">Back</button>
    <div class="question-box">
      <p id="question"></p>
      <div id="hints"></div>
      <input type="text" id="answer" placeholder="Answer" />
      <button id="submit-btn" class="btn">Submit</button>
    </div>
  </div>

  <!-- External JS -->
  <script src="game.js"></script>
</body>
</html>
